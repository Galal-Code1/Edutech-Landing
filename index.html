<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edutech Landing</title>
    <link rel="stylesheet" href="src/output.css" />
    <link rel="styleshe0et" href="master.css" />
  </head>
  <body class="bg-[#F9FCFF] font-myFont">
    <header class="w-[1300px] m-auto flex justify-between items-center p-5">
      <img src="./assets/Logo.png" alt="" class="logo" />
      <!-- navbar -->
      <ul class="flex">
        <li class="mx-[30px]">
          <a href="#">About us</a>
        </li>
        <li class="mx-[30px]">
          <a href="#">Our Class</a>
        </li>
        <li class="mx-[30px]">
          <a href="#">Blog</a>
        </li>
        <li class="mx-[30px]">
          <a href="#">Content</a>
        </li>
      </ul>
      <!-- search section -->
      <section class="search">
        <input
          type="text"
          placeholder="Search"
          class="bg-white border-1 border-[#EBEFF6] rounded-[5px] py-1 px-4 outline-0"
        />
      </section>
    </header>
    <div class="hero w-[1300px] m-auto mt-[40px] flex w-[100%] h-[80vh]">
      <section class="left-side h-[100%] flex-1 relative">
        <h1 class="font-myFont text-[56px] font-bold">
          Master Digital Skills<br />
          with Ease!
        </h1>
        <p class="my-[40px] text-[#1A2434] text-[20px] font-normal">
          Unlock Digital Mastery Effortlessly! Explore and enhance your skills
          with our user-friendly platform.
        </p>
        <section
          class="total-students mb-[40px] border-[#8D054F] border-l-[4px] pl-[40px]"
        >
          <h2>Total students</h2>
          <div class="students h-[66px] w-[265px] relative mt-[10px]">
            <div
              src="./assets/test.png"
              class="bg-black rounded-[50%] border-white border-[2px] w-[64px] h-[64px] absolute inset-y-0 inset-x-0"
            ></div>
            <div
              src="./assets/test.png"
              class="bg-black rounded-[50%] border-white border-[2px] w-[64px] h-[64px] absolute inset-x-[15%]"
            ></div>
            <div
              src="./assets/test.png"
              class="bg-black rounded-[50%] border-white border-[2px] w-[64px] h-[64px] absolute inset-x-[30%]"
            ></div>
            <div
              src="./assets/test.png"
              class="bg-black rounded-[50%] border-white border-[2px] w-[64px] h-[64px] absolute inset-x-[45%]"
            ></div>
            <div
              src="./assets/test.png"
              class="bg-black rounded-[50%] border-white border-[2px] w-[64px] h-[64px] absolute inset-x-[60%]"
            ></div>
          </div>
        </section>
        <section class="start-buttons">
          <button
            class="bg-[#8D054F] px-[32px] py-[16px] rounded-[8px] text-white font-bold text-[20px] cursor-pointer"
          >
            Start learning
          </button>
          <button
            class="border-[#8D054F] border-2 px-[32px] py-[16px] rounded-[8px] text-black font-bold text-[20px] cursor-pointer ml-[16px]"
          >
            Learn more
          </button>
        </section>
        <div class="social-media-button absolute bottom-0">
          <h2 class="title text-[#1A2434] font-bold text-[20px] mb-[10px]">
            Trusted by
          </h2>
          <section>
            <button
              class="google-bto bg-white rounded-[8px] py-[10px] px-[30px] border-1 border-[#EBEFF6] cursor-pointer "
            >
              <img src="./assets/Google Logotype.png" alt="" />
            </button>
            <button
              class="google-bto bg-white rounded-[8px] py-[10px] px-[30px] border-1 border-[#EBEFF6] cursor-pointer "
            >
              <img src="./assets/Canva Logotype.png" alt="" />
            </button>
            <button
              class="google-bto bg-white rounded-[8px] py-[10px] px-[30px] border-1 border-[#EBEFF6] cursor-pointer "
            >
              <img src="./assets/Amazon.png" alt="" />
            </button>
            <button
              class="google-bto bg-white rounded-[8px] py-[10px] px-[30px] border-1 border-[#EBEFF6] cursor-pointer "
            >
              <img src="./assets/Sketch Logotype.png" alt="" />
            </button>
          </section>
        </div>
      </section>
      <section class="right-side bg-green-400 h-[100%] flex-1"></section>
    </div>
  </body>
</html>
